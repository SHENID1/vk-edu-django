<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">
    <meta name=viewport
          content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
    <link rel="stylesheet" href="./base.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Intel+One+Mono:ital,wght@0,300..700;1,300..700&family=Neucha&display=swap"
          rel="stylesheet">
    <title>AskPupkin</title>

</head>
<body>
<header class="header-section">
    <div class="wr">
        <div class="logo">AskPupkin</div>
        <div class="search-container">
            <label>
                <input type="text" class="search-input shadow" placeholder="Search">
            </label>
            <button class="ask-button shadow">ASK!</button>
        </div>
        <div class="user-panel">
            <div class="login-links">
                <a href="#">log in</a>
                <a href="#">register</a>
            </div>
        </div>
    </div>

</header>
<main class="main-content">

    <div class="form-container">
        <h2 style="margin-bottom: 25px">New Question</h2>

        <div class="form-group">
            <label for="title" class="w-50">Title</label>
            <input type="text" id="title" value="How to build a moon park ?">
        </div>

        <div class="form-group">
            <label for="text" class="w-50">Text</label>
            <textarea id="text">Really, how ?
Have no idea about it</textarea>
        </div>

        <div class="form-group">
            <label for="tags" class="w-50">Tags</label>
            <input type="text" id="tags" value="moon, park, puzzle">
        </div>

        <button class="shadow">ASK!</button>
    </div>

    <div class="right-column">
        <div class="section-title">Popular Tags</div>
        <div class="tag-list">
            <span class="tag-item">perl</span>
            <span class="tag-item tag-python">python</span>
            <span class="tag-item">TechnoPark</span>
            <span class="tag-item tag-mysql">MySQL</span>
            <span class="tag-item tag-django">django</span>
            <span class="tag-item">Mail.Ru</span>
            <span class="tag-item">Voloshin</span>
            <span class="tag-item tag-firefox">Firefox</span>
        </div>

        <div class="section-title">Best Members</div>
        <ul class="member-list">
            <li><a href="#">Mr. Freeman</a></li>
            <li><a href="#">Dr. House</a></li>
            <li><a href="#">Bender</a></li>
            <li><a href="#">Queen Victoria</a></li>
            <li><a href="#">V. Pupkin</a></li>
        </ul>
    </div>
</main>

<script>
    document.getElementById("inp1").value = 5;
    document.getElementById("inp2").value = 5;
    document.getElementById("inp3").value = 5;

</script>
</body>
</html>
