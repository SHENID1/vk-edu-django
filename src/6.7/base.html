<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">
    <meta name=viewport
          content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
    <link rel="stylesheet" href="./base.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Intel+One+Mono:ital,wght@0,300..700;1,300..700&family=Neucha&display=swap"
          rel="stylesheet">
    <title>AskPupkin</title>

</head>
<body>
<header class="header-section">
    <div class="wr">
        <div class="logo">AskPupkin</div>
        <div class="search-container">
            <label>
                <input type="text" class="search-input shadow" placeholder="Search">
            </label>
            <button class="ask-button shadow">ASK!</button>
        </div>
        <div class="user-panel">
            <div class="avatar">Avatar</div>
            <div class="user-info">
                <div class="username">Dr. Pepper</div>
                <div class="user-links">
                    <a href="#">settings</a>
                    <a href="#">log out</a>
                </div>
            </div>
        </div>
    </div>

</header>
<main class="main-content">

    <div class="left-column">


    <h1>Registration</h1>

    <div class="error-message">Sorry, this email address already registered!</div>

    <div class="form-group">
        <label class="form-label">Login</label>
        <label>
            <input type="text" class="form-input" value="dr_pepper">
        </label>
    </div>

    <div class="form-group">
        <label class="form-label">Email</label>
        <label>
            <input type="email" class="form-input" value="drpepper@mail.ru">
        </label>
    </div>

    <div class="form-group">
        <label class="form-label">NickName</label>
        <label>
            <input type="text" class="form-input" value="Dr. Pepper">
        </label>
    </div>

    <div class="form-group">
        <label class="form-label">Password</label>
        <label>
            <input type="password" class="form-input" value="*******">
        </label>
    </div>

    <div class="form-group">
        <label class="form-label">Repeat password</label>
        <label>
            <input type="password" class="form-input" value="*******">
        </label>
    </div>

    <div class="form-group">
        <label class="form-label">Upload avatar</label>
        <div class="avatar-wrapper">
            <input type="file" id="avatar-upload" class="file-input" accept="image/*">
            <div class="fake-file-input" id="file-path">c:\avatar.jpg</div>
            <label for="avatar-upload" class="choose-button">choose</label>
        </div>
    </div>

    <button class="register-button shadow">Register!</button>

    <script>
        document.getElementById('avatar-upload').addEventListener('change', function(e) {
            const filePath = e.target.value;
            console.log(e)
            if (filePath) {
                document.getElementById('file-path').textContent = filePath;
            }
        });
    </script>
    </div>

    <div class="right-column">
        <div class="section-title">Popular Tags</div>
        <div class="tag-list">
            <span class="tag-item">perl</span>
            <span class="tag-item tag-python">python</span>
            <span class="tag-item">TechnoPark</span>
            <span class="tag-item tag-mysql">MySQL</span>
            <span class="tag-item tag-django">django</span>
            <span class="tag-item">Mail.Ru</span>
            <span class="tag-item">Voloshin</span>
            <span class="tag-item tag-firefox">Firefox</span>
        </div>

        <div class="section-title">Best Members</div>
        <ul class="member-list">
            <li><a href="#">Mr. Freeman</a></li>
            <li><a href="#">Dr. House</a></li>
            <li><a href="#">Bender</a></li>
            <li><a href="#">Queen Victoria</a></li>
            <li><a href="#">V. Pupkin</a></li>
        </ul>
    </div>
</main>

<script>
    document.getElementById("inp1").value = 5;
    document.getElementById("inp2").value = 5;
    document.getElementById("inp3").value = 5;

</script>
</body>
</html>
